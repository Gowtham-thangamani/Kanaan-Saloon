  <script>
    const INDEX = [
      { t: 'الرئيسية', d: 'كنعان', u: 'index.html' },
      { t: 'عن كنعان', d: 'قصّتنا ومعيارنا', u: 'about.html' },
      { t: 'الخدمات', d: 'جميع خدمات العناية', u: 'services.html' },
      { t: 'الشعر واللحية', d: 'قصّ، حلاقة، نحت لحية', u: 'services/hair-beard.html' },
      { t: 'العناية بالبشرة', d: 'جلسات وجه، هايدرا', u: 'services/facial-skin-care.html' },
      { t: 'المساج', d: 'سويدي، عميق، استشفاء', u: 'services/massage.html' },
      { t: 'الحمّام المغربي', d: 'طقس مغربي أصيل', u: 'services/moroccan-bath.html' },
      { t: 'الأظافر', d: 'يدين وقدمين', u: 'services/manicure-pedicure.html' },
      { t: 'علاجات الشعر', d: 'بروتين، كيراتين', u: 'services/hair-treatment.html' },
      { t: 'باقات العناية', d: 'باقات متعدّدة الخدمات', u: 'services/grooming-packages.html' },
      { t: 'العروض', d: 'عروض وباقات مختارة', u: 'offers.html' },
      { t: 'الفروع', d: 'جميع فروع كنعان العشرة', u: 'branches.html' },
      { t: 'كنعان العين', d: 'فرع العين', u: 'branches/al-ain.html' },
      { t: 'كنعان مدينة خليفة', d: 'فرع مدينة خليفة', u: 'branches/khalifa-city.html' },
      { t: 'كنعان الخالدية', d: 'فرع الخالدية', u: 'branches/khalidiya.html' },
      { t: 'كنعان بني ياس سبا', d: 'فرع السبا', u: 'branches/baniyas-spa.html' },
      { t: 'كنعان بني ياس باربر', d: 'صالون حلاقة محترف', u: 'branches/baniyas-barber.html' },
      { t: 'كنعان ربدان', d: 'فرع ربدان', u: 'branches/rabdan.html' },
      { t: 'كنعان الشهامة القديمة', d: 'فرع الشهامة', u: 'branches/old-shahamah.html' },
      { t: 'كنعان الشهامة الجديدة', d: 'فرع الشهامة الجديدة', u: 'branches/new-shahamah.html' },
      { t: 'كنعان المرور باربر', d: 'فرع المرور', u: 'branches/muroor.html' },
      { t: 'كنعان VIP المرور', d: 'جناح VIP خاص', u: 'branches/vip-muroor.html' },
      { t: 'المعرض', d: 'من داخل الفروع', u: 'gallery.html' },
      { t: 'احجز الآن', d: 'حجز إلكتروني', u: 'book' },
      { t: 'تواصل', d: 'تواصل معنا', u: 'contact.html' }
    ];
    const r = document.getElementById('results'), e = document.getElementById('empty');
    function render(q) {
      const t = q.trim();
      const matches = !t ? INDEX : INDEX.filter(i => (i.t + ' ' + i.d).includes(t));
      r.innerHTML = matches.map(m => `<a href="${m.u}" class="branch-card"><div class="branch-card__body"><h3 class="branch-card__title" style="font-size: 22px;">${m.t}</h3><p class="branch-card__meta">${m.d}</p></div></a>`).join('');
      e.style.display = matches.length ? 'none' : 'block';
    }
    const params = new URLSearchParams(location.search);
    document.getElementById('q').value = params.get('q') || '';
    render(params.get('q') || '');
    document.getElementById('q').addEventListener('input', e => render(e.target.value));
    document.getElementById('searchForm').addEventListener('submit', e => e.preventDefault());
  </script>
