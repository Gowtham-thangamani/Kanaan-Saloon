<body class="lang-ar">
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="logo" aria-label="كنعان — صالون وسبا للرجال"><img src="../assets/img/logo.svg" alt="كنعان صالون وسبا للرجال" class="logo-img" /></a>
      <nav class="main-nav"><a href="index.html">الرئيسية</a><a href="../branches.html">البيوت والخدمات</a></nav>
      <div class="header-actions"><a href="../search.html" class="lang-switch">EN</a><a href="book.html" class="btn btn--sm">احجز الآن</a></div>
    </div>
  </header>

  <main id="main"><section class="page-hero" style="min-height: 40vh;">
    <div class="page-hero__media" data-parallax="bg" data-speed="0.50">
      <img src="../assets/img/photos/arch-corridor-marble-1600.webp" alt="" loading="eager" fetchpriority="high" decoding="async" />
    </div>
    <div class="container page-hero__content" style="position: relative; z-index: 2;">
      <span class="eyebrow">البحث</span>
      <h1 class="page-hero__title" data-split="lines">عمّ تبحث؟</h1>
      <form id="searchForm" style="margin-top: var(--s-5); max-width: 600px;">
        <input type="search" id="q" class="input" placeholder="فرع · خدمة · عرض…" style="width: 100%; padding: 18px 20px; font-size: 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--c-smoke); color: var(--c-pearl);" autofocus />
      </form>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="results" class="grid grid-3"></div>
      <p id="empty" style="text-align: center; color: var(--muted); display: none;">لا نتائج. جرّب اسم فرع (مدينة خليفة، بنياس، العين) أو خدمة (قصّة، جلسة وجه، حمّام مغربي).</p>
    </div>
  </section></main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-newsletter">
        <div>
          <h5>النشرة</h5>
          <p>عروض ومستجدّات كنعان مرّة كل شهر — لا أكثر.</p>
        </div>
        <form data-newsletter-form>
          <input type="email" name="email" required placeholder="بريدك الإلكتروني" aria-label="البريد الإلكتروني" />
          <button type="submit" class="btn btn--sm">اشترك</button>
        </form>
      </div>
      <div class="footer-bottom"><span>© ٢٠٢٦ كنعان.</span></div></div>
  </footer>

  <script>
    const INDEX = [
      { t: 'الرئيسية', d: 'كنعان', u: 'index.html' },
      { t: 'عن كنعان', d: 'قصّتنا ومعيارنا', u: 'about.html' },
      { t: 'الخدمات', d: 'جميع خدمات العناية', u: 'services.html' },
      { t: 'الشعر واللحية', d: 'قصّ، حلاقة، نحت لحية', u: 'services/hair-beard.html' },
      { t: 'العناية بالبشرة', d: 'جلسات وجه، هايدرا', u: 'services/facial-skin-care.html' },
      { t: 'المساج', d: 'سويدي، عميق، استشفاء', u: 'services/massage.html' },
      { t: 'الحمّام المغربي', d: 'طقس مغربي أصيل', u: 'services/moroccan-bath.html' },
      { t: 'الأظافر', d: 'يدين وقدمين', u: 'services/manicure-pedicure.html' },
      { t: 'علاجات الشعر', d: 'بروتين، كيراتين', u: 'services/hair-treatment.html' },
      { t: 'باقات العناية', d: 'باقات متعدّدة الخدمات', u: 'services/grooming-packages.html' },
      { t: 'العروض', d: 'عروض وباقات مختارة', u: 'offers.html' },
      { t: 'الفروع', d: 'جميع بيوت كنعان العشرة', u: 'branches.html' },
      { t: 'كنعان العين', d: 'فرع العين', u: 'branches/al-ain.html' },
      { t: 'كنعان مدينة خليفة', d: 'فرع مدينة خليفة', u: 'branches/khalifa-city.html' },
      { t: 'كنعان الخالدية', d: 'فرع الخالدية', u: 'branches/khalidiya.html' },
      { t: 'كنعان بنياس سبا', d: 'بيت السبا', u: 'branches/baniyas-spa.html' },
      { t: 'كنعان بنياس باربر', d: 'صالون حلاقة محترف', u: 'branches/baniyas-barber.html' },
      { t: 'كنعان ربدان', d: 'فرع ربدان', u: 'branches/rabdan.html' },
      { t: 'كنعان الشهامة القديمة', d: 'فرع الشهامة', u: 'branches/old-shahamah.html' },
      { t: 'كنعان الشهامة الجديدة', d: 'فرع الشهامة الجديدة', u: 'branches/new-shahamah.html' },
      { t: 'كنعان المرور', d: 'فرع المرور', u: 'branches/muroor.html' },
      { t: 'كنعان VIP المرور', d: 'جناح VIP خاص', u: 'branches/vip-muroor.html' },
      { t: 'المعرض', d: 'من داخل البيوت', u: 'gallery.html' },
      { t: 'احجز الآن', d: 'حجز إلكتروني', u: 'book.html' },
      { t: 'تواصل', d: 'تواصل معنا', u: 'contact.html' }
    ];
    const r = document.getElementById('results'), e = document.getElementById('empty');
    function render(q) {
      const t = q.trim();
      const matches = !t ? INDEX : INDEX.filter(i => (i.t + ' ' + i.d).includes(t));
      r.innerHTML = matches.map(m => `<a href="${m.u}" class="branch-card"><div class="branch-card__body"><h3 class="branch-card__title" style="font-size: 22px;">${m.t}</h3><p class="branch-card__meta">${m.d}</p></div></a>`).join('');
      e.style.display = matches.length ? 'none' : 'block';
    }
    const params = new URLSearchParams(location.search);
    document.getElementById('q').value = params.get('q') || '';
    render(params.get('q') || '');
    document.getElementById('q').addEventListener('input', e => render(e.target.value));
    document.getElementById('searchForm').addEventListener('submit', e => e.preventDefault());
  </script>
  <script src="../assets/js/runtime.js"></script>

  <script src="../assets/js/tracking.js"></script>

  <script src="../assets/js/motion.js?v=18" defer></script>
  <script src="../assets/js/quickbook.js" defer></script>
  <script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("../sw.js").catch(function(){});});}</script>
</body>
