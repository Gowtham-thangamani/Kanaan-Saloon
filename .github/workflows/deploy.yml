name: Deploy to Hostinger

# Runs on every push to main. Merge/push to main = goes live automatically.
# Feature branches (e.g. arabic-content-rebuild) never trigger a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # kanaanspa.ae is served from the addon-domain root, NOT the account's
          # /public_html/. Deploying to /public_html/ ran green for months while
          # nothing reached the live site: every live file kept the same
          # Last-Modified (the last manual zip extraction), and the sync-state
          # file the action writes into its target dir 404s at the web root
          # while /.htaccess correctly 403s — so that dir is not the docroot.
          # If a run ever uploads but the site still does not change, re-check
          # this path in hPanel (File Manager -> folder holding the live
          # index.html) before assuming a caching problem.
          server-dir: /domains/kanaanspa.ae/public_html/
          exclude: |
            .git*
            .git*/**
            .github/**
            .claude/**
            .superpowers/**
            docs/**
            supabase/**
            tools/**
            node_modules/**
            README.md
            START_HERE.md
            SUPABASE_SETUP.md
            LAUNCH_CHECKLIST.md
            fetch-fonts.js
            set-domain.js
            generate-*.js
            *.zip
