name: Deploy to Hostinger

# Runs on every push to main. Merge/push to main = goes live automatically.
# Feature branches (e.g. arabic-content-rebuild) never trigger a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Verify this matches where your FTP account actually lands —
          # some Hostinger accounts land directly in public_html (use "./"),
          # others need the explicit path.
          server-dir: /public_html/
          exclude: |
            .git*
            .git*/**
            .github/**
            .claude/**
            .superpowers/**
            docs/**
            supabase/**
            tools/**
            node_modules/**
            README.md
            START_HERE.md
            SUPABASE_SETUP.md
            LAUNCH_CHECKLIST.md
            fetch-fonts.js
            set-domain.js
            generate-*.js
            *.zip
