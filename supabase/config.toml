# Supabase project config (used by the Supabase CLI)
project_id = "kanaan-bookings"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://kanaanspa.ae"
additional_redirect_urls = ["http://127.0.0.1:5500", "http://localhost:5500"]
enable_signup = false   # bookings happen anonymously; admin auth is separate

[functions.notify-booking]
verify_jwt = false  # called by the database webhook with the service role; no JWT
