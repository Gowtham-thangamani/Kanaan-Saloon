<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-labelledby="kanaan-logo-title">
  <title id="kanaan-logo-title">Kanaan — Gents Salon &amp; Spa</title>
  <defs>
    <style>
      .kw { font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif; font-weight: 500; letter-spacing: 8px; }
      .kt { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- Ornamental crescent mark (left) -->
  <g transform="translate(8 14)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M0 34 Q 18 6, 44 14"/>
    <path d="M2 42 Q 22 14, 50 22"/>
    <path d="M4 50 Q 26 22, 56 30"/>
    <circle cx="48" cy="44" r="6" fill="currentColor" stroke="none"/>
  </g>

  <!-- "KANAAN" wordmark -->
  <text class="kw" x="80" y="56" font-size="44" fill="currentColor">KANAAN</text>
  <!-- Gold accent dot -->
  <text class="kw" x="312" y="56" font-size="44" fill="#C8A04A">.</text>

  <!-- "GENTS SALON &amp; SPA" subtitle, tracked out -->
  <text class="kt" x="80" y="80" font-size="9" fill="currentColor" opacity="0.75">GENTS SALON &amp; SPA</text>

  <!-- Hairline rule under the wordmark -->
  <line x1="80" y1="66" x2="304" y2="66" stroke="currentColor" stroke-width="0.5" opacity="0.35"/>
</svg>
